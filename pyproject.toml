[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/contracts",
    "packages/storage",
    "packages/models",
    "packages/media",
    "packages/analysis",
    "packages/editorial",
    "packages/rendering",
    "packages/vault",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "N"]
ignore = [
    "ANN101",
    "ANN102",
]

[tool.ruff.lint.isort]
known-first-party = ["stream_editor"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "packages/contracts/src:packages/storage/src:packages/models/src:packages/media/src:packages/analysis/src:packages/editorial/src:packages/rendering/src:packages/vault/src:apps/api/src:apps/worker/src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
pythonpath = [
    "packages/contracts/src",
    "packages/storage/src",
    "packages/models/src",
    "packages/media/src",
    "packages/analysis/src",
    "packages/editorial/src",
    "packages/rendering/src",
    "packages/vault/src",
    "apps/api/src",
    "apps/worker/src"
]

[tool.coverage.run]
source = ["packages", "apps"]
omit = ["*/tests/*", "*/__init__.py"]

[project]
name = "stream-editor-ai-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0"
]

[[tool.mypy.overrides]]
module = ["stream_editor.worker.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "sqlalchemy.*",
    "alembic.*"
]
ignore_missing_imports = true
