[project]
name = "stream-editor-storage"
version = "0.1.0"
description = "Storage abstraction for StreamEditor AI"
requires-python = ">=3.12"
dependencies = [
    "stream-editor-contracts",
]

[tool.uv.sources]
stream-editor-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_editor"]
