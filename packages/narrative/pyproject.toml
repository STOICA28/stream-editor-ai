[project]
name = "stream-editor-narrative"
version = "0.1.0"
description = "Story Graph and narrative intelligence for StreamEditor AI"
requires-python = ">=3.12"
dependencies = [
    "stream-editor-contracts",
    "stream-editor-models",
]

[tool.uv.sources]
stream-editor-contracts = { workspace = true }
stream-editor-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_editor"]
